[package]
name = "comfyui-studio"
version = "0.1.0"
description = "ComfyUI Studio - 桌面版 ComfyUI 工作流操作平台"
authors = ["ComfyUI Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "comfyui_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 系统级全局快捷键（Alt+2 呼出/最小化窗口，应用不在焦点也能触发）
tauri-plugin-global-shortcut = "2"
# Windows 原生系统通知（窗口在后台/托盘时出图完成提醒）
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "fs", "time"] }
dirs = "5"
urlencoding = "2"
# 解析资产内嵌元数据：zTXt 解压用 flate2，预览图转 data URL 用 base64
flate2 = "1"
base64 = "0.22"

# 读取剪贴板里的文件列表（资源管理器复制的图片文件直接粘贴上传）
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
